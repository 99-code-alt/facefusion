name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout FaceFusion
        uses: actions/checkout@v4

      - name: Download private QNN headers
        uses: actions/checkout@v4
        with:
          repository: 99-code-alt/qnn-headers-private
          token: ${{ secrets.QNN_HEADERS_TOKEN }}
          path: qnn-headers-temp

      - name: Install QNN headers
        run: |
          mkdir -p work/android/app/src/main/cpp/include
          cp -R qnn-headers-temp/QNN work/android/app/src/main/cpp/include/

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: work/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: work/android/app/build/outputs/apk/debug/*.apk
